<main class="bootstrap-screen">
  <section class="brand">
    <div class="sigil"></div>

    <h1>TEBM V3</h1>
    <p class="subtitle">The Elden BloodMoon</p>

    <div class="status" [class.online]="backendStatus === 'online'" [class.offline]="backendStatus === 'offline'">
      @if (backendStatus === 'checking') {
      <span class="dot"></span>
      Verificando backend...
      }

      @if (backendStatus === 'online') {
      <span class="dot"></span>
      Backend conectado
      }

      @if (backendStatus === 'offline') {
      <span class="dot"></span>
      Backend indisponível
      }
    </div>
  </section>
</main>
